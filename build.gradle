plugins {
    id 'com.android.application'
}

android {
    namespace 'com.harvesthaven.app'
    compileSdk 35

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    defaultConfig {
        applicationId 'com.harvesthaven.app'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName '0.3-test'
    }
}
